track: chess
suite: chess_standard

run:
  N_EPISODES: 50
  BENCHMARK_VERBOSE: 1

provider:
  LM_PROVIDER: openai
  OPENAI_MODEL: o3
  OPENAI_REASONING_EFFORT: medium
  OPENAI_MAX_COMPLETION_TOKENS: 16384

env:
  CHESS_EXTREME: 1
  USE_LICHESS: 1

probes:
  HARD_HIDDEN_MIN_PLIES: 70
  HARD_HIDDEN_MAX_PLIES: 120
  HARD_HIDDEN_CAPTURE_BIAS: 0.62
